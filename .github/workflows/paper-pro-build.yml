# EXPERIMENTAL: builds Ink Diary for Paper Pro using the 3.28 Ferrari SDK.
# The target device runs 3.29.1.0. Never install this build until ABI and
# firmware-dependent notebook insertion methods have been verified.
name: Paper Pro experimental ARM64 build (firmware guard fixed)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4

      - name: Verify the source tree
        shell: bash
        run: |
          set -euo pipefail
          test -s src/diary.cpp
          test -s src/layout.h
          test -s build.sh
          test -s ink-diary.xovi
          echo "Original Ink Diary source files found"

      - name: Install official Ferrari 3.28 cross-compiler SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_URL="https://storage.googleapis.com/remarkable-codex-toolchain/3.28.0.172/remarkable-production-image-5.8.203-ferrari-public-x86_64-toolchain.sh"
          curl --fail --location --retry 3 "$SDK_URL" --output "$RUNNER_TEMP/ferrari-sdk.sh"
          chmod +x "$RUNNER_TEMP/ferrari-sdk.sh"
          mkdir -p "$RUNNER_TEMP/ferrari-sdk"
          "$RUNNER_TEMP/ferrari-sdk.sh" -y -d "$RUNNER_TEMP/ferrari-sdk"
          envfile=$(find "$RUNNER_TEMP/ferrari-sdk" -maxdepth 1 -name 'environment-setup-*' -type f -print -quit)
          test -n "$envfile"
          echo "SDK_ENV=$envfile" >> "$GITHUB_ENV"
          echo "Installed Ferrari 3.28 SDK: $envfile"

      - name: Apply experimental Paper Pro source changes
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/apply_port.py" <<'INK_DIARY_PORT_PY'
          #!/usr/bin/env python3
          """Experimental source-only port preparation for Ink Diary 4.1 (RMPP OS 3.29.1.0).
          
          Does NOT compile, install or modify the tablet. Run against a fresh checkout of
          https://github.com/mmoscat/remarkable-chatgpt (expected main at Nov 2026).
          
          Safety: fails closed if any upstream source patterns differ, prepares all edits
          before touching files and saves backups before replacements.
          """
          
          import argparse
          from pathlib import Path
          
          
          def substitute_once(text: str, old: str, new: str, name: str) -> str:
              n = text.count(old)
              if n != 1:
                  raise RuntimeError(f"{name}: expected exactly one match, found {n}; no files changed")
              return text.replace(old, new, 1)
          
          
          def prepare(srcdir: Path):
              layout = srcdir / "src" / "layout.h"
              diary = srcdir / "src" / "diary.cpp"
              original = {p: p.read_text(encoding="utf-8") for p in (layout, diary)}
              changed = dict(original)
          
              changed[layout] = substitute_once(
                  changed[layout],
                  '#include <QRect>\n',
                  '#include <QRect>\n#include <QSize>\n',
                  'layout.h includes',
              )
              changed[layout] = substitute_once(
                  changed[layout],
                  'inline QRect diaryCaptureArea() { return QRect(150,0,1174,1752); }',
                  '''// Experimental Paper Pro portrait capture bounds (1620 x 2160).
          // Exclude toolbar and bottom controls; validate on device before live API use.
          // Return empty for all unknown resolutions: never guess pen/image coordinates.
          inline QRect diaryCaptureArea(const QSize &screen) {
              if (screen == QSize(1620, 2160)) return QRect(173, 0, 1354, 2022);
              return QRect();
          }''',
                  'layout.h capture area',
              )
          
              changed[diary] = substitute_once(
                  changed[diary],
                  '''require(screen.width()==1404 && screen.height()==1872,
                          "First version requires rM2 portrait (1404 x 1872)");''',
                  '''require(screen.width()==1620 && screen.height()==2160,
                          "This experimental port requires Paper Pro portrait (1620 x 2160)");''',
                  'diary.cpp resolution guard',
              )
              changed[diary] = substitute_once(
                  changed[diary],
                  'const QRect area=diaryCaptureArea();',
                  '''const QRect area=diaryCaptureArea(screen.size());
                  require(area.isValid() && screen.rect().contains(area),
                          "Capture bounds are invalid for this display");''',
                  'diary.cpp capture call',
              )
              changed[diary] = substitute_once(
                  changed[diary],
                  'int width=area.width(), available=1582;',
                  'int width=area.width(), available=1825;',
                  'diary.cpp render bounds',
              )
              changed[diary] = substitute_once(
                  changed[diary],
                  'QFile version("/usr/share/remarkable/update.conf");',
                  'QFile version("/etc/os-release");',
                  'diary.cpp firmware path',
              )
              changed[diary] = substitute_once(
                  changed[diary],
                  '"REMARKABLE_RELEASE_VERSION=3.27.3.0"',
                  '"IMG_VERSION=\\"3.29.1.0\\""',
                  'diary.cpp firmware guard',
              )
              return original, changed
          
          
          def main():
              ap = argparse.ArgumentParser(description=__doc__)
              ap.add_argument('checkout', type=Path, help='Directory containing upstream Ink Diary checkout')
              ap.add_argument('--apply', action='store_true', help='Actually change source files; otherwise preview only')
              args = ap.parse_args()
              srcdir = args.checkout.resolve()
              original, changed = prepare(srcdir)
              if not args.apply:
                  print('Source patterns verified; DRY RUN ONLY. Use --apply to create .rm2-original backups and patch sources.')
                  return
              for path in original:
                  backup = path.with_name(path.name + '.rm2-original')
                  if backup.exists():
                      raise RuntimeError(f'{backup}: backup exists; refusing to overwrite source')
              for path in original:
                  path.with_name(path.name + '.rm2-original').write_text(original[path], encoding='utf-8')
              for path in changed:
                  path.write_text(changed[path], encoding='utf-8')
              print('Applied source-only edits to', srcdir)
              print('Not built or tested. DO NOT install a generated native extension without validating SDK ABI and firmware APIs.')
          
          
          if __name__ == '__main__':
              main()
          INK_DIARY_PORT_PY
          python3 "$RUNNER_TEMP/apply_port.py" "$GITHUB_WORKSPACE" --apply
          git diff --check
          git diff --stat

      - name: Build ARM64 extension using upstream XOVI tools
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/asivery/xovi.git "$RUNNER_TEMP/xovi"
          SDK_ENV="$SDK_ENV" XOVI_REPO="$RUNNER_TEMP/xovi" bash ./build.sh
          file bin/ink-diary.so
          file bin/config-model
          readelf -h bin/ink-diary.so | grep -E 'Class:|Machine:'
          test -s bin/ink-diary.so
          strings bin/ink-diary.so | grep -F '/etc/os-release'
          strings bin/ink-diary.so | grep -F 'IMG_VERSION=' 
          if strings bin/ink-diary.so | grep -F '/usr/share/remarkable/update.conf'; then
            echo 'ERROR: Old firmware path still in extension' >&2
            exit 1
          fi
          echo "Built experimental native extension with Codex firmware guard. DO NOT INSTALL YET."

      - name: Upload experimental build for inspection only
        uses: actions/upload-artifact@v4
        with:
          name: ink-diary-paper-pro-FIRMWARE-FIX-UNTESTED
          path: |
            bin/ink-diary.so
            bin/config-model
          if-no-files-found: error
          retention-days: 7
